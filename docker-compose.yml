services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: condocorp
      POSTGRES_PASSWORD: condocorp
      POSTGRES_DB: condocorp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condocorp -d condocorp"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
